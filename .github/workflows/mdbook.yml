name: Deploy mdBook to GitHub Pages

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/Test-MarkdownLinks.ps1'
      - 'tests/Unit/MarkdownLinks.Tests.ps1'
      - '.github/workflows/mdbook.yml'
  push:
    branches: [main]
    paths:
      - 'docs/gitbook/**'
      - '.github/workflows/mdbook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check local Markdown links
        shell: pwsh
        run: ./scripts/Test-MarkdownLinks.ps1

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Build book
        run: mdbook build docs/gitbook

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/gitbook/book

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
