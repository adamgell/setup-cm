name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.0.0 -Force -Scope CurrentUser
          Invoke-Pester ./tests/Unit -Output Detailed -CI
