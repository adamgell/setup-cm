name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell test dependencies
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.0.0 -Force -Scope CurrentUser
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser

      - name: Check local Markdown links
        shell: pwsh
        run: ./scripts/Test-MarkdownLinks.ps1

      - name: Run portable unit tests
        shell: pwsh
        run: |
          Invoke-Pester ./tests/Unit -Output Detailed -CI
